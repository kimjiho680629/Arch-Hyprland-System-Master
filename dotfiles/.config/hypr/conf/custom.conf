# Add your additional Hyprland configurations here
bind = ALT, V, exec, ~/.config/hypr/scripts/show_shortcuts.sh

# Flatpak 구글 크롬 한글 입력(Fcitx5) 권한 및 Wayland Native 강제 실행 매 부팅 시 영구 강제 동기화
exec-once = flatpak override --user --talk-name=org.fcitx.Fcitx5 --filesystem=xdg-run/fcitx --socket=wayland --env=GTK_IM_MODULE=fcitx --env=QT_IM_MODULE=fcitx --env=XMODIFIERS=@im=fcitx --env=OZONE_PLATFORM=wayland --env=ELECTRON_OZONE_PLATFORM_HINT=auto com.google.Chrome

# NVIDIA 전용 Wayland 하드웨어 가속 환경 변수 보강
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

# 100Hz/60Hz 혼합 주사율 환경에서 디아블로4와 유튜브 동시 실행 시 스터터링 및 프레임 드랍 최적화
render {
    # Nvidia 드라이버 환경에서 게임 프레임 합성 단계를 생략하여 성능을 극대화하기 위해 direct_scanout 활성화
    direct_scanout = true
}

misc {
    # 모니터 물리적 미지원 또는 혼합 주사율 프레임 잠김 방지를 위해 가변 주사율(VRR) 비활성화
    vrr = 0
}

# 디아블로 4 항상 100Hz 주 모니터(HDMI-A-1)로 고정 구동 및 전체화면 강제 규칙
windowrulev2 = monitor HDMI-A-1, class:^(Diablo IV.exe)$
windowrulev2 = monitor HDMI-A-1, title:^(Diablo IV)$
windowrulev2 = monitor HDMI-A-1, class:^(steam_app_default)$
windowrulev2 = monitor HDMI-A-1, title:^(디아블로 IV)$
windowrulev2 = fullscreen, title:^(디아블로 IV)$
windowrulev2 = fullscreen, title:^(Diablo IV)$

# -----------------------------------------------------
# 상하 듀얼 모니터 영구 고정 설정 (상단 34인치 100Hz / 하단 27인치 4K 1.5x 중앙 정렬)
# -----------------------------------------------------
monitor = desc:CMT GM34-CWQ2 CMI235200056, 3440x1440@100.0, 0x0, 1.0, vrr, 0
monitor = desc:Dell Inc. DELL U2723QE 4ZJP4P3, 3840x2160@60.0, 440x1440, 1.5, vrr, 0

# 워크스페이스 고정 바인딩 (상단: 1~5, 하단: 6~10)
workspace = 1, monitor:HDMI-A-1, default:true
workspace = 2, monitor:HDMI-A-1
workspace = 3, monitor:HDMI-A-1
workspace = 4, monitor:HDMI-A-1
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:DP-2, default:true
workspace = 7, monitor:DP-2
workspace = 8, monitor:DP-2
workspace = 9, monitor:DP-2
workspace = 10, monitor:DP-2
