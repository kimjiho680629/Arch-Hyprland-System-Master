<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
  <!-- 1. 기본 generic 폰트 매칭 -->
  <match target="pattern">
    <test name="family" qual="any"><string>sans-serif</string></test>
    <edit binding="strong" mode="prepend" name="family">
      <string>FiraCode Nerd Font Light</string>
      <string>KoPubWorldDotum_Pro</string>
      <string>KoPubWorld돋움체_Pro</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>serif</string></test>
    <edit binding="strong" mode="prepend" name="family">
      <string>FiraCode Nerd Font Light</string>
      <string>KoPubWorldDotum_Pro</string>
      <string>KoPubWorld돋움체_Pro</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>monospace</string></test>
    <edit binding="strong" mode="prepend" name="family">
      <string>FiraCode Nerd Font Mono Light</string>
      <string>KoPubWorldDotum_Pro</string>
      <string>KoPubWorld돋움체_Pro</string>
    </edit>
  </match>

  <!-- 2. 웹 브라우저용 영문 폰트 강제 대체 (Alias) -->
  <match target="pattern">
    <test name="family" qual="any"><string>Arial</string></test>
    <edit binding="strong" mode="prepend" name="family">
      <string>FiraCode Nerd Font Light</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Helvetica</string></test>
    <edit binding="strong" mode="prepend" name="family">
      <string>FiraCode Nerd Font Light</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Verdana</string></test>
    <edit binding="strong" mode="prepend" name="family">
      <string>FiraCode Nerd Font Light</string>
    </edit>
  </match>

  <!-- 3. Apple 스타일 렌더링 최적화 -->
  <match target="font">
    <edit mode="assign" name="antialias"><bool>true</bool></edit>
    <edit mode="assign" name="hinting"><bool>false</bool></edit>
    <edit mode="assign" name="autohint"><bool>false</bool></edit>
    <edit mode="assign" name="hintstyle"><const>hintnone</const></edit>
    <edit mode="assign" name="rgba"><const>rgb</const></edit>
    <edit mode="assign" name="lcdfilter"><const>lcddefault</const></edit>
  </match>

  <!-- 4. 한글 폰트 가중치 보정 (KoPubWorld 폰트에만 Regular 고정) -->
  <match target="font">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family" compare="contains"><string>KoPubWorld</string></test>
    <edit mode="assign" name="weight"><int>80</int></edit>
  </match>
</fontconfig>
